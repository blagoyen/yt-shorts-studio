[package]
name = "yt-shorts-studio"
version = "1.1.0"
description = "Local gaming Shorts editor"
authors = ["YT Shorts Studio"]
default-run = "yt-shorts-studio"
edition = "2021"

[lib]
name = "yt_shorts_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "fs", "macros", "rt-multi-thread"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
